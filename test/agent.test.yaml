# Overlay for scripts/test-config.sh and test/buffering.sh, merged over config/agent.yaml (--config twice).
# Reads the fixtures from the beginning and sends OTLP/JSON to test/otlp-sink.py instead of ingest.
receivers:
  journald:
    directory: /var/log/journal/fixture
    start_at: beginning
  filelog:
    start_at: beginning
  filelog/docker:
    start_at: beginning
extensions:
  file_storage:
    directory: ${env:TEST_WORK}/buffer
    compaction:
      directory: ${env:TEST_WORK}/buffer
exporters:
  otlphttp:
    encoding: json
    compression: none
    sending_queue:
      batch:
        flush_timeout: 1s
