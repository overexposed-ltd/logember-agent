# LogEmber agent: OpenTelemetry Collector pipeline.
# Values in ${env:...} are written by install.sh into /etc/logember/agent.env.
#
# Every record leaving the agent follows proto/log-schema.json in the main LogEmber repo:
#   body                          the raw line (journald: MESSAGE), never empty
#   time                          from the line when it carries one, else the time the agent read it
#   severity_text                 one of trace|debug|info|warn|error|fatal, severity_number to match
#   attributes["logember.service"] unit, program, /var/log/<dir>/ or file name, container name; "unknown" if none
#   attributes["logember.env"]     $LOGEMBER_ENV
#   other attributes              flattened JSON fields etc.: lowercase dotted keys, string values, max 64
#   resource host.name            from resourcedetection
#
# Extra files added in the hub come from /etc/logember/sources.yaml, which logember-agent-sync
# writes (one filelog/hub_* receiver each, in the pipeline logs/hub) and the unit passes as
# another --config.
#
# Sources and double reading: journald is the primary source for system and service logs.
# On Ubuntu (and Debian with rsyslog installed) rsyslog copies the same journal into
# /var/log/syslog, auth.log, kern.log, ... so those files are NOT read; reading them too
# would ship every system line twice. /var/log/*.log still catches files that applications
# write themselves (dpkg.log, cloud-init.log, fail2ban.log, ...), which are not in journald.
#
# Docker: container logs are read from the json-file log driver's files (the Docker default).
# config/docker.yaml is merged over this file when the agent can reach the Docker API, and then
# names each container (see deploy/logember-agent.service); without it, the short container ID
# is the service. Without Docker the glob below matches nothing and the agent stays quiet.
receivers:
  journald:
    # No `directory`: journalctl then reads both /var/log/journal (persistent) and /run/log/journal.
    priority: info
    start_at: end
    storage: file_storage
    convert_message_bytes: true
    operators:
      - type: filter
        expr: 'body.MESSAGE == nil or body.MESSAGE matches "^\\s*$"'
  filelog:
    include:
      - /var/log/*.log
      - /var/log/nginx/*.log
    exclude:
      - /var/log/logember-agent.log
      # rsyslog copies of journald (see the note at the top)
      - /var/log/auth.log
      - /var/log/cron.log
      - /var/log/daemon.log
      - /var/log/kern.log
      - /var/log/lpr.log
      - /var/log/mail.log
      - /var/log/ufw.log
      - /var/log/user.log
    start_at: end
    storage: file_storage
    include_file_path: true
    include_file_name: false
    operators:
      - type: filter
        expr: 'body matches "^\\s*$"'
  # Replaced by receiver_creator/docker in config/docker.yaml; keep the operators the same in both.
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: end
    storage: file_storage
    include_file_path: true
    include_file_name: false
    operators:
      # One JSON object per line: {"log":"GET / HTTP/1.1 200\n","stream":"stdout","time":"2026-10-26T12:00:00.123456789Z"}
      - type: json_parser
        on_error: send_quiet
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z07:00'
      # Docker splits lines longer than 16 KiB into several entries; only the last one ends with "\n".
      - type: recombine
        if: 'attributes.log != nil'
        combine_field: attributes.log
        combine_with: ""
        is_last_entry: 'attributes.log endsWith "\n"'
        max_log_size: 1MiB
      - type: move
        if: 'attributes.log != nil'
        from: attributes.log
        to: body
      - type: add
        field: body
        value: 'EXPR(trimSuffix(trimSuffix(body, "\n"), "\r"))'
      - type: remove
        if: 'attributes.time != nil'
        field: attributes.time
      - type: filter
        expr: 'body matches "^\\s*$"'

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
  resourcedetection:
    detectors: [system]
    system: { hostname_sources: [os] }
  # Maps both sources onto the record schema. One statement list, so `cache` (per record) carries
  # the detected level and the parsed JSON from one step to the next. Statements that fail on a
  # line (bad JSON, unparsable time) are skipped for that line only; `silent` keeps the agent from
  # logging every such line into journald, where it would read its own warnings back.
  transform/normalize:
    error_mode: silent
    log_statements:
      - context: log
        statements:
          # --- journald: the body is the journal entry as a map ---
          - 'set(cache["journal"], body) where IsMap(body) and body["__CURSOR"] != nil'
          # service: systemd unit without ".service" (and without a template instance: postgresql@16-main -> postgresql),
          # else the syslog identifier, else the command name
          - 'set(attributes["logember.service"], cache["journal"]["_COMM"]) where cache["journal"]["_COMM"] != nil'
          - 'set(attributes["logember.service"], cache["journal"]["SYSLOG_IDENTIFIER"]) where cache["journal"]["SYSLOG_IDENTIFIER"] != nil'
          - 'set(attributes["logember.service"], cache["journal"]["_SYSTEMD_UNIT"]) where IsMatch(cache["journal"]["_SYSTEMD_UNIT"], "\\.service$")'
          - 'replace_pattern(attributes["logember.service"], "(@[^.]*)?\\.service$", "") where cache["journal"] != nil'
          - 'set(cache["level"], cache["journal"]["PRIORITY"])'
          - 'set(attributes["systemd.unit"], cache["journal"]["_SYSTEMD_UNIT"]) where cache["journal"]["_SYSTEMD_UNIT"] != nil'
          - 'set(attributes["syslog.identifier"], cache["journal"]["SYSLOG_IDENTIFIER"]) where cache["journal"]["SYSLOG_IDENTIFIER"] != nil'
          - 'set(attributes["process.pid"], cache["journal"]["_PID"]) where cache["journal"]["_PID"] != nil'
          - 'set(attributes["process.command"], cache["journal"]["_COMM"]) where cache["journal"]["_COMM"] != nil'
          - 'set(body, cache["journal"]["MESSAGE"]) where cache["journal"] != nil'

          # --- files: service from the path, more specific rules below override it ---
          # /var/log/dpkg.log -> dpkg
          - 'set(attributes["logember.service"], ExtractPatterns(attributes["log.file.path"], "(?P<name>[^/]+?)(\\.log)?$")["name"])'
          # syslog-format lines (rsyslog rules, apps logging via syslog to their own file):
          # "Oct 26 12:00:00 web1 myapp[42]: msg" or "2026-10-26T12:00:00.123456+00:00 web1 myapp[42]: msg" -> myapp
          - 'set(cache["syslog"], ExtractPatterns(body, "^(?P<ts>[A-Z][a-z]{2} [ 0-9]\\d \\d\\d:\\d\\d:\\d\\d|\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d\\S*) (?P<host>\\S+) (?P<prog>[^\\s\\[\\]:]+)(?:\\[(?P<pid>\\d+)\\])?: ")) where attributes["log.file.path"] != nil'
          - 'set(attributes["logember.service"], cache["syslog"]["prog"]) where cache["syslog"]["prog"] != nil'
          - 'set(attributes["syslog.identifier"], cache["syslog"]["prog"]) where cache["syslog"]["prog"] != nil'
          - 'set(attributes["process.pid"], cache["syslog"]["pid"]) where cache["syslog"]["pid"] != nil'
          - 'set(cache["ts"], cache["syslog"]["ts"]) where IsMatch(cache["syslog"]["ts"], "^\\d{4}-")'
          # /var/log/nginx/error.log -> nginx
          - 'set(attributes["logember.service"], ExtractPatterns(attributes["log.file.path"], "^/var/log/(?P<dir>[^/]+)/")["dir"]) where IsMatch(attributes["log.file.path"], "^/var/log/[^/]+/")'
          # Docker container -> the container name (resource attribute from receiver_creator/docker), else the short container ID
          - 'set(cache["docker"], ExtractPatterns(attributes["log.file.path"], "^/var/lib/docker/containers/(?P<id>[0-9a-f]{64})/[0-9a-f]{64}-json\\.log$")) where attributes["log.file.path"] != nil'
          - 'set(attributes["container.id"], cache["docker"]["id"]) where IsString(cache["docker"]["id"])'
          - 'set(attributes["logember.service"], Substring(cache["docker"]["id"], 0, 12)) where IsString(cache["docker"]["id"])'
          - 'set(attributes["container.image.name"], resource.attributes["container.image.name"]) where IsString(cache["docker"]["id"]) and IsString(resource.attributes["container.image.name"])'
          - 'set(attributes["container.name"], resource.attributes["container.name"]) where IsString(cache["docker"]["id"]) and IsString(resource.attributes["container.name"])'
          - 'set(attributes["logember.service"], attributes["container.name"]) where IsString(attributes["container.name"]) and attributes["container.name"] != ""'
          # files added in the hub (/etc/logember/sources.yaml): the service set there wins
          - 'set(attributes["logember.service"], attributes["logember.source.service"]) where attributes["logember.source.service"] != nil'
          - 'delete_key(attributes, "logember.source.service")'

          # --- access logs (nginx/apache combined or common format): fields, time, severity from status ---
          - 'set(cache["http"], ExtractPatterns(body, "^(?P<client>\\S+) \\S+ \\S+ \\[(?P<ts>[^\\]]+)\\] \"(?P<method>[A-Z]+) (?P<path>\\S+)[^\"]*\" (?P<status>\\d{3}) (?P<size>\\d+|-)(?: \"(?P<referer>[^\"]*)\" \"(?P<ua>[^\"]*)\")?")) where attributes["log.file.path"] != nil'
          - 'set(attributes["client.address"], cache["http"]["client"]) where cache["http"]["client"] != nil'
          - 'set(attributes["http.request.method"], cache["http"]["method"]) where cache["http"]["method"] != nil'
          - 'set(attributes["url.path"], cache["http"]["path"]) where cache["http"]["path"] != nil'
          - 'set(attributes["http.response.status_code"], cache["http"]["status"]) where cache["http"]["status"] != nil'
          - 'set(attributes["http.response.body.size"], cache["http"]["size"]) where cache["http"]["size"] != nil and cache["http"]["size"] != "-"'
          - 'set(attributes["http.request.header.referer"], cache["http"]["referer"]) where cache["http"]["referer"] != nil and cache["http"]["referer"] != "-"'
          - 'set(attributes["user_agent.original"], cache["http"]["ua"]) where cache["http"]["ua"] != nil'
          - 'set(time, Time(cache["http"]["ts"], "%d/%b/%Y:%H:%M:%S %z")) where cache["http"]["ts"] != nil'
          - 'set(cache["level"], "error") where IsMatch(cache["http"]["status"], "^5")'
          - 'set(cache["level"], "warn") where IsMatch(cache["http"]["status"], "^4")'
          - 'set(cache["level"], "info") where IsMatch(cache["http"]["status"], "^[123]")'

          # --- JSON lines: fields become attributes (flattened, lowercase dotted keys, string values) ---
          - 'set(cache["json"], ParseJSON(body)) where IsString(body) and IsMatch(body, "^\\s*\\{")'
          - 'flatten(cache["json"]) where IsMap(cache["json"])'
          - 'replace_all_patterns(cache["json"], "key", "[A-Z]+", "$$0", ToLowerCase) where IsMap(cache["json"])'
          - 'replace_all_patterns(cache["json"], "key", "\\s+", "_") where IsMap(cache["json"])'
          - 'stringify_all(cache["json"]) where IsMap(cache["json"])'
          # the logember.* keys are ours; a field of the same name must not override them
          - 'delete_matching_keys(cache["json"], "^logember\\.") where IsMap(cache["json"])'
          - 'merge_maps(attributes, cache["json"], "insert") where IsMap(cache["json"])'
          - 'set(cache["level"], Coalesce([cache["json"]["level"], cache["json"]["severity"], cache["json"]["lvl"], cache["json"]["log.level"], cache["json"]["levelname"], cache["json"]["loglevel"]])) where IsMap(cache["json"])'
          - 'set(cache["ts"], Coalesce([cache["json"]["time"], cache["json"]["timestamp"], cache["json"]["@timestamp"], cache["json"]["ts"], cache["json"]["datetime"]])) where IsMap(cache["json"])'
          # RFC3339 / ISO 8601 (JSON fields, syslog lines): with or without fractional seconds,
          # offset "Z", "+02:00" or "+0200", "T" or " " between date and time. No offset: not parsed.
          - 'replace_pattern(cache["ts"], "^(\\d{4}-\\d\\d-\\d\\d) ", "$$1T")'
          - 'replace_pattern(cache["ts"], "Z$", "+00:00")'
          - 'replace_pattern(cache["ts"], "([+-]\\d\\d)(\\d\\d)$", "$$1:$$2")'
          - 'set(time, Time(cache["ts"], "%Y-%m-%dT%H:%M:%S%j")) where IsMatch(cache["ts"], "^\\d{4}-\\d\\d-\\d\\dT")'
          # Unix seconds (1793000000 or 1793000000.123) and milliseconds (1793000000123)
          - 'set(time_unix_nano, Int(Double(cache["ts"]) * 1000000000.0)) where IsMatch(cache["ts"], "^\\d{10}(\\.\\d+)?$")'
          - 'set(time_unix_nano, Int(cache["ts"]) * 1000000) where IsMatch(cache["ts"], "^\\d{13}$")'

          # --- plain text (and JSON without a level field): guess the level from the line ---
          # "not IsString": a set() from a missing value leaves an empty value behind, which is not nil.
          # logfmt / key-value: level=warn, severity: ERROR
          - 'set(cache["guess"], ExtractPatterns(body, "(?i)\\b(?:level|severity|lvl)[=:]\\s*\"?(?P<lvl>[a-z]+)")) where not IsString(cache["level"]) and IsString(body)'
          - 'set(cache["level"], cache["guess"]["lvl"]) where cache["guess"]["lvl"] != nil'
          # first level word: "ERROR ...", "[error]" (nginx error log), "<warn>", "sshd[1]: error: ...", an "ERROR ..." JSON string
          - 'set(cache["guess"], ExtractPatterns(body, "(?:^|[\\s\\[<(|\"])(?P<lvl>TRACE|DEBUG|INFO|NOTICE|WARN|WARNING|ERROR|ERR|CRIT|CRITICAL|ALERT|EMERG|FATAL|PANIC|(?i:trace|debug|info|notice|warn|warning|error|err|crit|critical|alert|emerg|fatal|panic)[\\]>):|])(?:\\W|$)")) where not IsString(cache["level"]) and IsString(body)'
          - 'set(cache["level"], cache["guess"]["lvl"]) where cache["guess"]["lvl"] != nil'

          # --- severity: map whatever was found onto the schema enum ---
          # Strings follow the OTel data model mappings: syslog crit/alert are ERROR, .NET/Python "critical" is FATAL.
          # Numbers: 0-7 are syslog priorities (journald PRIORITY), 10-60 are pino/bunyan levels.
          - 'set(cache["level"], ToLowerCase(String(cache["level"]))) where cache["level"] != nil'
          - 'set(severity_text, "info")'
          - 'set(severity_text, "trace") where IsMatch(cache["level"], "^(trace|trc|verbose|finest|10)\\b")'
          - 'set(severity_text, "debug") where IsMatch(cache["level"], "^(debug|dbg|fine|finer|7|20)\\b")'
          - 'set(severity_text, "warn") where IsMatch(cache["level"], "^(warn|warning|wrn|4|40)\\b")'
          - 'set(severity_text, "error") where IsMatch(cache["level"], "^(error|err|eror|crit|alert|severe|1|2|3|50)\\b")'
          - 'set(severity_text, "fatal") where IsMatch(cache["level"], "^(fatal|ftl|critical|emerg|emergency|panic|dpanic|0|60)\\b")'
          - 'set(severity_number, SEVERITY_NUMBER_TRACE) where severity_text == "trace"'
          - 'set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == "debug"'
          - 'set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "info"'
          - 'set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "warn"'
          - 'set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "error"'
          - 'set(severity_number, SEVERITY_NUMBER_FATAL) where severity_text == "fatal"'

          # --- common ---
          - 'set(time, observed_time) where time_unix_nano == 0'
          - 'set(body, String(body)) where not IsString(body)'
          - 'set(attributes["logember.service"], "unknown") where attributes["logember.service"] == nil or attributes["logember.service"] == ""'
          - 'replace_pattern(attributes["logember.service"], "^(.{128}).+$", "$$1")'
          - 'set(attributes["logember.env"], "${env:LOGEMBER_ENV}")'
          - 'stringify_all(attributes)'
          - 'truncate_all(attributes, 2048)'
          - 'limit(attributes, 64, ["logember.service", "logember.env", "log.file.path"])'
  # Secrets are removed here, on the host, after the line has been mapped onto the schema, so
  # the body and every attribute derived from it (JSON fields, url.path, ...) are covered.
  # Three steps, all stock components:
  #   transform/redact  key=value style secrets, in the body and in every attribute value. The
  #                     key stays, the value becomes ****: "password=****", "Authorization:
  #                     Bearer ****", {"api_key":"****"}. (redactionprocessor would replace the
  #                     whole match, key included, since it has no capture groups.)
  #   redaction         attributes whose key names a secret (a JSON field "password", ...),
  #                     and values recognizable on their own: AWS access key IDs, card numbers.
  #   redaction/local   the host's own rules from /etc/logember/redaction.yaml (see that file).
  # redactionprocessor v0.163.0 applies blocked_values to string bodies as well as attributes.
  transform/redact:
    error_mode: silent
    log_statements:
      - context: log
        statements:
          # Authorization headers: "Authorization: Bearer <token>", "authorization=<token>", JSON "Authorization":"Basic <...>"
          - 'replace_pattern(body, "(?i)(authorization[\"\\x27]?\\s*[=:]\\s*[\"\\x27]?(?:(?:bearer|basic|digest|token|negotiate)\\s+)?)[^\\s\"\\x27,;}]+", "$$1****")'
          - 'replace_all_patterns(attributes, "value", "(?i)(authorization[\"\\x27]?\\s*[=:]\\s*[\"\\x27]?(?:(?:bearer|basic|digest|token|negotiate)\\s+)?)[^\\s\"\\x27,;}]+", "$$1****")'
          # bearer tokens anywhere else ("Bearer" plus at least 16 token characters)
          - 'replace_pattern(body, "(?i)(\\bbearer\\s+)[A-Za-z0-9\\-._~+/]{16,}=*", "$$1****")'
          - 'replace_all_patterns(attributes, "value", "(?i)(\\bbearer\\s+)[A-Za-z0-9\\-._~+/]{16,}=*", "$$1****")'
          # key=value, key: value, "key":"value", key='value' for password, secret, token, *_key names.
          # Quoted values first (up to the closing quote, escaped quotes included), then bare ones.
          - 'replace_pattern(body, "(?i)((?:passw(?:or)?d|passphrase|secret|token|(?:api|access|secret|private|signing|encryption)[_-]?key|apikey)\"?\\s*[=:]\\s*\")(?:[^\"\\\\]|\\\\.)*", "$$1****")'
          - 'replace_all_patterns(attributes, "value", "(?i)((?:passw(?:or)?d|passphrase|secret|token|(?:api|access|secret|private|signing|encryption)[_-]?key|apikey)\"?\\s*[=:]\\s*\")(?:[^\"\\\\]|\\\\.)*", "$$1****")'
          - 'replace_pattern(body, "(?i)((?:passw(?:or)?d|passphrase|secret|token|(?:api|access|secret|private|signing|encryption)[_-]?key|apikey)[\"\\x27]?\\s*[=:]\\s*\\x27)[^\\x27]*", "$$1****")'
          - 'replace_all_patterns(attributes, "value", "(?i)((?:passw(?:or)?d|passphrase|secret|token|(?:api|access|secret|private|signing|encryption)[_-]?key|apikey)[\"\\x27]?\\s*[=:]\\s*\\x27)[^\\x27]*", "$$1****")'
          - 'replace_pattern(body, "(?i)((?:passw(?:or)?d|passphrase|secret|token|(?:api|access|secret|private|signing|encryption)[_-]?key|apikey)\"?\\s*[=:]\\s*)[^\\s\"\\x27,;&}\\]]+", "$$1****")'
          - 'replace_all_patterns(attributes, "value", "(?i)((?:passw(?:or)?d|passphrase|secret|token|(?:api|access|secret|private|signing|encryption)[_-]?key|apikey)\"?\\s*[=:]\\s*)[^\\s\"\\x27,;&}\\]]+", "$$1****")'
  redaction:
    allow_all_keys: true
    # The whole value is masked. Matched against the end of the key, so "auth.password",
    # "client_secret" and "password.0" (a flattened JSON array) match, "max_tokens" does not.
    blocked_key_patterns:
      - '(?i)(passw(or)?d|passphrase|secret|token|(api|access|secret|private|signing|encryption)[_-]?key|apikey|authorization)(\.\d+)?$'
    blocked_values:
      # AWS access key IDs (long-term AKIA, temporary ASIA)
      - '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
      # Card numbers by issuer prefix and length, no Luhn check: Visa 4 (16/19 digits),
      # Mastercard 51-55 and 22-27, Amex 34/37 (15), Diners 30/36/38 (14), JCB 35, Discover/UnionPay 6.
      # Unix timestamps in ms/ns and snowflake IDs start with 1 and are not matched.
      # Unbroken digits:
      - '\b(?:4\d{15}(?:\d{3})?|5[1-5]\d{14}|2[2-7]\d{14}|3[47]\d{13}|3[0689]\d{12}|35\d{14,17}|6\d{15,18})\b'
      # 4-4-4-4 groups (plus up to 3 digits), separated by a space or a dash:
      - '\b(?:4\d{3}|5[1-5]\d{2}|2[2-7]\d{2}|35\d{2}|6\d{3})(?:[ -]\d{4}){3}(?:[ -]\d{1,3})?\b'
      # Amex 4-6-5 and Diners 4-6-4:
      - '\b3[0-9]\d{2}[ -]\d{6}[ -]\d{4,5}\b'
    summary: silent
  # Placeholder for the rules in /etc/logember/redaction.yaml, which the unit passes as a second
  # --config; its blocked_values replace this empty list. Keeps agent.yaml valid on its own.
  redaction/local:
    allow_all_keys: true
    blocked_values: []
    summary: silent

extensions:
  # Holds the receivers' read positions (journald cursor, file offsets) and the sending queue,
  # one bbolt file each. Only the queue file grows; the others stay at a few KiB.
  file_storage:
    directory: /var/lib/logember/buffer
    create_directory: true   # /var/lib/logember itself comes from StateDirectory= in the unit
    timeout: 10s
    # Hard limit per file (1 GiB). The queue's own limit (sending_queue.queue_size) is reached
    # first; this one only matters if bbolt's overhead is far above what was measured.
    max_size: 1073741824
    compaction:
      # bbolt files never shrink by themselves: once the queue has drained below 10 MiB after
      # having grown past 100 MiB, rewrite the file to give the space back. The temporary copy
      # is written next to it (/tmp is read-only under ProtectSystem=strict) and is at most the
      # size of what is still queued, i.e. under 10 MiB.
      directory: /var/lib/logember/buffer
      on_rebound: true
      rebound_needed_threshold_mib: 100
      rebound_trigger_threshold_mib: 10
      cleanup_on_start: true
  bearertokenauth:
    token: "${env:LOGEMBER_INGEST_KEY}"

exporters:
  otlphttp:
    endpoint: "${env:LOGEMBER_INGEST_URL}"   # https://ingest.logember.com
    compression: zstd
    auth: { authenticator: bearertokenauth }
    # Disk buffer: every record is written to the queue on disk before the receivers move on, and
    # leaves it only once ingest has accepted it, so an outage or a restart loses nothing
    # (test/buffering.sh). Delivery is at-least-once: a request ingest accepted just before the
    # agent was killed is sent again after the restart.
    #
    # Disk use: /var/lib/logember/buffer stays under 1 GiB (file_storage max_size; the read
    # positions add a few KiB). queue_size counts the uncompressed OTLP bytes of the queued
    # records and is the limit reached first; the bbolt file around them is larger by up to 16 MiB
    # plus page overhead, which is why the file limit has headroom.
    #
    # When the queue is full (ingest unreachable for long enough to queue 512 MiB), the agent
    # drops nothing itself, neither oldest nor newest: block_on_overflow makes the receivers wait,
    # so the agent stops reading and new lines stay in the log files and the journal. Once ingest
    # is back the queue drains oldest first and reading resumes where it stopped. Lines are lost
    # only when they are gone from the source by then (a file rotated to a name the include
    # patterns do not match, journald vacuuming old entries), or, if the agent is stopped while
    # the queue is full, the one batch each receiver was waiting to enqueue (up to 100 lines,
    # logged as "ConsumeLogs() failed ... context canceled"). Waiting is not logged; the queue
    # fill level is in the agent's metrics on localhost:8888 (otelcol_exporter_queue_size against
    # otelcol_exporter_queue_capacity). A write the storage refuses (disk full, max_size reached)
    # drops that batch and is logged as an error ("ConsumeLogs() failed").
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 536870912   # 512 MiB of uncompressed OTLP (roughly 1-2 million log lines)
      block_on_overflow: true
      # Batching happens here, after the disk queue, instead of in a batch processor: a batch
      # processor keeps records in memory for up to its timeout after the receivers have saved
      # their read positions, and those records are lost if the agent is killed.
      batch:
        sizer: items
        min_size: 8192
        max_size: 16384
        flush_timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 0   # retry forever; 429/503 wait for Retry-After when ingest sends one

service:
  extensions: [file_storage, bearertokenauth]
  pipelines:
    logs:
      receivers: [journald, filelog, filelog/docker]   # config/docker.yaml restates this list
      # sources.yaml adds a pipeline logs/hub with the hub's receivers and these processors and
      # exporters: change PROCESSORS and EXPORTERS in deploy/logember-agent-sync with them.
      processors: [memory_limiter, resourcedetection, transform/normalize, transform/redact, redaction, redaction/local]
      exporters: [otlphttp]
  telemetry:
    logs: { level: warn }
