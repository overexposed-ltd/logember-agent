# CI: build the linux binaries, shellcheck the scripts, validate config/agent.yaml.
# Actions are pinned by commit SHA; the comment after each pin is the release tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build.sh derives the version from `git describe --tags`
          persist-credentials: false

      # scripts/build.sh is the single place where the Go version is pinned.
      - name: Read pinned Go version
        id: pins
        run: echo "go=$(sed -n 's/^GO_VERSION=//p' scripts/build.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache: false # no go.sum in the repo; the module cache is handled below

      # Go modules, build cache and the checksum-verified ocb binary in .tools/.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            .tools
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('builder-config.yaml', 'scripts/build.sh') }}
          restore-keys: build-${{ runner.os }}-${{ runner.arch }}-

      - name: Build linux/amd64 and linux/arm64
        run: scripts/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/logember-agent_linux_*
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned release, verified by checksum, instead of whatever the runner image ships.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          case "$(uname -m)" in
            x86_64) arch=x86_64 sha=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 ;;
            aarch64) arch=aarch64 sha=12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588 ;;
          esac
          tarball="shellcheck-${SHELLCHECK_VERSION}.linux.${arch}.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${tarball}"
          echo "$sha  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: shellcheck
        run: |
          files=(install.sh scripts/*.sh)
          [[ -f uninstall.sh ]] && files+=(uninstall.sh)
          shellcheck --version
          shellcheck "${files[@]}"

  validate:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LOGEMBER_ENV: ci
      LOGEMBER_INGEST_URL: https://ingest.invalid
      LOGEMBER_INGEST_KEY: dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Artifacts do not keep the executable bit.
      - name: Verify checksums
        run: |
          (cd dist && sha256sum -c checksums.txt)
          chmod +x dist/logember-agent_linux_*

      - name: logember-agent validate
        run: |
          agent="dist/logember-agent_linux_$(dpkg --print-architecture)"
          "$agent" --version
          "$agent" validate --config config/agent.yaml

      # Runs the agent on test/fixtures in a Debian 12 container and checks every record it sends.
      - name: scripts/test-config.sh
        if: hashFiles('scripts/test-config.sh') != ''
        run: ARCH="$(dpkg --print-architecture)" scripts/test-config.sh
